name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (major|minor)"
        type: choice
        options: [major, minor]
        default: minor

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "${{ github.repository }}/discord-bot"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
      - name: Lint and format with Ruff
        run: |
          pip install ruff
          ruff check src
          ruff format --check src

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
          if [[ $LATEST_TAG =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}
          else
            MAJOR=0; MINOR=0
          fi
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            NEW_MAJOR=$MAJOR; NEW_MINOR=$((MINOR + 1))
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.bump }}" == "major" ]]; then
              NEW_MAJOR=$((MAJOR + 1)); NEW_MINOR=0
            else
              NEW_MAJOR=$MAJOR; NEW_MINOR=$((MINOR + 1))
            fi
          fi
          NEW_VERSION="v${NEW_MAJOR}.${NEW_MINOR}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: [test, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create Git tag
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git tag ${{ needs.version.outputs.version }}
          git push origin ${{ needs.version.outputs.version }}
